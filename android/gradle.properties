org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Dirección de la API (server/public/api.php servida por Apache).
# Debug: 10.0.2.2 es tu PC vista desde el emulador. Con un celular real usa la IP de tu PC en la red, por ejemplo
# http://192.168.1.50/CarrouselApp/api.php, y agrega esa IP a allowed_hosts en server/config/local.php.
carrouselApiUrlDebug=http://10.0.2.2/CarrouselApp/api.php
# Release: siempre HTTPS. Servidor de producción detrás de Cloudflare.
carrouselApiUrlRelease=https://portal.carrousel-apps.com/CarrouselApp/api.php
